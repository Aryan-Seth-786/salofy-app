<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GLAZZ Exotic Liquid Drop">
  <defs>
    <radialGradient id="glow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff738a"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#b5123b"/>
      <stop offset="100%" stop-color="#670822"/>
    </radialGradient>
    <linearGradient id="swirl1" x1="20%" y1="20%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ff9ab0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="innerDepth" x1="50%" y1="10%" x2="50%" y2="90%">
      <stop offset="0%" stop-color="#ffa0b4" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38040e" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle canvas -->
  <rect width="512" height="512" rx="116" fill="#120f0d"/>

  <!-- Ambient liquid reflection glow -->
  <ellipse cx="256" cy="390" rx="110" ry="24" fill="#f43f5e" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Main Exotic Organic Droplet Body -->
  <path fill="url(#glow)" filter="url(#softGlow)" d="
    M256,76
    C264,115 310,188 344,242
    C374,288 382,336 358,378
    C332,424 282,438 244,436
    C192,434 142,398 136,342
    C132,300 156,252 188,206
    C220,160 250,110 256,76 Z
  "/>

  <!-- Internal fluid swirl / viscous refraction wave -->
  <path fill="url(#innerDepth)" d="
    M256,108
    C284,178 346,256 340,332
    C336,380 292,416 248,416
    C208,416 160,378 164,324
    C168,266 220,204 256,108 Z
  "/>

  <!-- Luminous crest swirl -->
  <path fill="none" stroke="url(#swirl1)" stroke-width="12" stroke-linecap="round" d="
    M252,112
    C240,160 186,228 178,284
    C170,336 196,382 242,392
    C278,400 318,376 328,340
  "/>

  <!-- Specular highlights (glass/viscous glaze shine) -->
  <path fill="#ffffff" opacity="0.85" d="
    M248,94
    C244,118 214,172 198,212
    C190,230 182,246 178,264
    C176,250 184,226 198,198
    C218,158 244,110 248,94 Z
  "/>
  <ellipse cx="204" cy="228" rx="8" ry="18" transform="rotate(-24 204 228)" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="320" cy="336" rx="6" ry="14" transform="rotate(32 320 336)" fill="#ffffff" opacity="0.45"/>
</svg>
