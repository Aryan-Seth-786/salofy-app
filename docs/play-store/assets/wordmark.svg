<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-label="GLAZZ">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa0b4"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#b5123b"/>
    </linearGradient>
  </defs>
  <style>
    .serif-letter {
      font-family: 'Fraunces', 'Didot', 'Bodoni MT', Georgia, serif;
      font-size: 110px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
  </style>
  <!-- G L A Z in luxury obsidian black -->
  <text x="40" y="118" class="serif-letter" fill="#120e0d">GLAZ</text>
  <!-- Second Z is a natural, identical, solid letter in glowing rose gradient (NO slash, NO cut) -->
  <text x="590" y="118" class="serif-letter" fill="url(#roseGrad)">Z</text>
</svg>
