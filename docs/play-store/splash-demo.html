<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLAZZ — Splash prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Onest:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f43f5e;
      --ink-900: #120f0d;
      --font-heading: Fraunces, Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0a09;
      font-family: Onest, system-ui, sans-serif;
      color: #f5f2f0;
    }
    .phone {
      width: min(390px, 100vw);
      height: min(844px, 100vh);
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      position: relative;
      background: #120f0d;
    }
    .replay {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: #f5f2f0;
      font: 500 13px Onest, system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
    }
    .replay:hover { background: rgba(255,255,255,0.12); }

    @keyframes glazzDropFall {
      0% { opacity: 0; transform: translateY(-42vh) scale(0.72); }
      12% { opacity: 1; }
      70% { opacity: 1; transform: translateY(8px) scale(1.04, 0.94); }
      82% { transform: translateY(-6px) scale(0.98, 1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes glazzWordIn {
      from { opacity: 0; transform: translateY(14px); letter-spacing: 0.35em; }
      to { opacity: 1; transform: translateY(0); letter-spacing: 0.18em; }
    }
    @keyframes glazzTagIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glazzRipple {
      0% { transform: scaleX(0.3); opacity: 0; }
      55% { opacity: 0; }
      70% { opacity: 0.35; transform: scaleX(1); }
      100% { opacity: 0; transform: scaleX(1.15); }
    }

    .glazz-splash {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, #120f0d 0%, #1a1412 48%, #120f0d 100%);
      padding: 0 24px 72px;
      overflow: hidden;
    }
    .glazz-splash__stage {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }
    .glazz-splash__drop {
      width: 72px;
      height: 96px;
      animation: glazzDropFall 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      filter: drop-shadow(0 18px 28px rgba(244, 63, 94, 0.35));
    }
    .glazz-splash__drop svg { width: 100%; height: 100%; display: block; }
    .glazz-splash__ripple {
      position: absolute;
      bottom: 8px;
      width: 64px;
      height: 8px;
      border-radius: 50%;
      background: rgba(244, 63, 94, 0.45);
      filter: blur(2px);
      animation: glazzRipple 1.15s ease forwards;
    }
    .glazz-splash__word {
      margin-top: 28px;
      font-family: var(--font-heading);
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #f5f2f0;
      opacity: 0;
      animation: glazzWordIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.95s forwards;
    }
    .glazz-splash__word span { color: var(--primary); }
    .glazz-splash__slash {
      display: inline-block;
      width: 0.12em;
      height: 0.85em;
      margin: 0 0.05em;
      background: var(--primary);
      transform: skewX(-18deg) translateY(0.06em);
      border-radius: 1px;
      vertical-align: baseline;
    }
    .glazz-splash__tag {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.42);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0;
      animation: glazzTagIn 0.45s ease 1.25s forwards;
    }
    .glazz-splash__hint {
      position: absolute;
      bottom: 48px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0;
      animation: glazzTagIn 0.4s ease 1.6s forwards;
    }
  </style>
</head>
<body>
  <div class="phone" id="stage"></div>
  <button class="replay" type="button" id="replay">Replay splash</button>
  <script>
    const dropSvg = `
      <svg viewBox="0 0 72 96" aria-hidden="true">
        <defs>
          <linearGradient id="glazzDropGrad" x1="20%" y1="5%" x2="80%" y2="95%">
            <stop offset="0%" stop-color="#ff6b7e"/>
            <stop offset="50%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#b5123b"/>
          </linearGradient>
        </defs>
        <path fill="url(#glazzDropGrad)" d="M36 4C36 4 64 42 64 62a28 28 0 1 1-56 0C8 42 36 4 36 4z"/>
        <ellipse cx="26" cy="40" rx="8" ry="14" fill="#fff" opacity="0.35"/>
      </svg>`;

    function mount() {
      document.getElementById('stage').innerHTML = `
        <div class="glazz-splash">
          <div class="glazz-splash__stage">
            <div class="glazz-splash__drop">${dropSvg}</div>
            <div class="glazz-splash__ripple" aria-hidden="true"></div>
          </div>
          <div class="glazz-splash__word">GLAZ<span class="glazz-splash__slash"></span><span>Z</span></div>
          <div class="glazz-splash__tag">Discover · Book · Glow</div>
          <div class="glazz-splash__hint">Tap to continue</div>
        </div>`;
    }
    mount();
    document.getElementById('replay').addEventListener('click', mount);
  </script>
</body>
</html>
