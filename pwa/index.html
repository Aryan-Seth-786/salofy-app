<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GLAZZ — Salons & Beauty Booking</title>
  <meta name="description" content="Discover salons near you, compare prices and book appointments in seconds.">
  <link rel="icon" href="/pwa/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f43f5e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GLAZZ">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- CSS (same order as the design reference) -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/screens.css">
  <link rel="stylesheet" href="/css/app-mode.css">
</head>
<body>
  <!-- Prod mode flag — screens read this to branch demo vs real behavior -->
  <script>window.APP_MODE = 'prod';</script>

  <div id="app">
    <div style="height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#120f0d">
      <div style="width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#fb7185,#f43f5e 55%,#9f1239);display:flex;align-items:center;justify-content:center;margin-bottom:20px">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
          <line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/>
          <line x1="8.12" y1="8.12" x2="12" y2="12"/>
        </svg>
      </div>
      <div style="font-size:26px;font-weight:700;color:#f43f5e;letter-spacing:-0.5px">GLAZZ</div>
      <div style="margin-top:16px;width:28px;height:28px;border:3px solid rgba(244,63,94,0.25);border-top-color:#f43f5e;border-radius:50%;animation:gspin 1s linear infinite"></div>
      <style>@keyframes gspin { to { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <!-- JS: Foundation -->
  <script src="/js/data.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/components.js"></script>

  <!-- JS: Canonical Components -->
  <script src="/js/components/service-card.js"></script>
  <script src="/js/components/package-card.js"></script>

  <!-- JS: Screens -->
  <script src="/js/screens/splash.js"></script>
  <script src="/js/screens/login.js"></script>
  <script src="/js/screens/otp.js"></script>
  <script src="/js/screens/home.js"></script>
  <script src="/js/screens/search-input.js"></script>
  <script src="/js/screens/search-results.js"></script>
  <script src="/js/screens/map.js"></script>
  <script src="/js/screens/salon-profile.js"></script>
  <script src="/js/screens/booking.js"></script>
  <script src="/js/screens/booking-confirmed.js"></script>
  <script src="/js/screens/service-detail.js"></script>
  <script src="/js/screens/notifications.js"></script>
  <script src="/js/screens/my-bookings.js"></script>
  <script src="/js/screens/reschedule.js"></script>
  <script src="/js/screens/favorites.js"></script>
  <script src="/js/screens/profile.js"></script>
  <script src="/js/screens/deals.js"></script>
  <script src="/js/screens/edit-profile.js"></script>
  <script src="/js/screens/saved-addresses.js"></script>
  <script src="/js/screens/refer-earn.js"></script>
  <script src="/js/screens/notification-settings.js"></script>
  <script src="/js/screens/help-support.js"></script>
  <script src="/js/screens/dashboard-growth.js"></script>
  <script src="/js/screens/dashboard-premium.js"></script>

  <!-- JS: API layer + app controller -->
  <script src="/js/api.js"></script>
  <script src="/js/app-prod.js"></script>
</body>
</html>
