<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GLAZZ — Offline</title>
  <style>
    :root { --primary: #f43f5e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #120f0d; color: #fff;
      height: 100dvh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 32px;
    }
    .badge {
      width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #fb7185, #f43f5e 55%, #9f1239);
      display: flex; align-items: center; justify-content: center;
    }
    .badge svg { width: 42px; height: 42px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { font-size: 15px; color: rgba(255,255,255,0.6); line-height: 1.5; margin-bottom: 28px; }
    button {
      padding: 14px 32px; border: none; border-radius: 14px;
      background: var(--primary); color: #fff; font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
        <line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/>
        <line x1="8.12" y1="8.12" x2="12" y2="12"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>GLAZZ needs a connection to show salons and bookings.<br>Check your internet and try again.</p>
    <button onclick="location.replace('/')">Try again</button>
  </div>
</body>
</html>
